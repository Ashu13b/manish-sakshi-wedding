<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeddingCraft Studio — Modular Wedding Website Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap">
<style>
:root {
  --primary: #c9933b;
  --primary-dark: #9e6f21;
  --bg-dark: #12151c;
  --panel-bg: #1a1e27;
  --border: #2c3240;
  --text: #e6e8ee;
  --text-muted: #959cb0;
  --accent: #e55353;
  --success: #28a745;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}
/* Left Panel: Studio Controls */
.studio-pane {
  width: 520px;
  min-width: 420px;
  background: var(--panel-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  z-index: 10;
}
.studio-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.2);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  font-size: 1.6rem;
}
.brand h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
}
.brand span {
  font-size: 0.65rem;
  text-transform: uppercase;
  color: var(--primary);
  display: block;
  font-weight: 600;
}
.preset-selector select {
  background: #11141c;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.75rem;
  outline: none;
}
.studio-tabs {
  display: flex;
  background: #151821;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab-btn {
  padding: 10px 14px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab-btn:hover { color: #fff; }
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  background: rgba(201, 147, 59, 0.05);
}
.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.form-group {
  margin-bottom: 16px;
}
.form-row {
  display: flex;
  gap: 12px;
}
.form-row .form-group {
  flex: 1;
}
label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input, textarea, select {
  width: 100%;
  padding: 8px 12px;
  background: #11141c;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--primary);
}
textarea { resize: vertical; min-height: 64px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: #111;
}
.btn-primary:hover { background: #e0a747; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.event-item {
  background: #141720;
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.event-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.guest-link-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: #141720;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 0.78rem;
}
.guest-link-row a {
  color: #25d366;
  text-decoration: none;
  font-weight: 600;
}

/* Right Panel: Live Preview Area */
.preview-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #0d0f14;
  height: 100vh;
}
.preview-toolbar {
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: #161922;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
.device-toggle {
  display: flex;
  gap: 4px;
  background: #11141c;
  padding: 3px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.device-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 4px 10px;
  font-size: 0.72rem;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
}
.device-btn.active {
  background: var(--primary);
  color: #111;
}
.preview-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
  background: radial-gradient(circle at center, #181d28 0%, #0d0f14 100%);
}
.phone-frame {
  width: 390px;
  height: 800px;
  max-height: 90vh;
  background: #000;
  border-radius: 40px;
  border: 10px solid #2a2e3d;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
  overflow: hidden;
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.phone-frame.tablet {
  width: 768px;
  border-radius: 24px;
}
.phone-frame.desktop {
  width: 100%;
  height: 100%;
  max-height: 100%;
  border-radius: 0;
  border: none;
}
.phone-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
}
</style>
</head>
<body>

<div class="studio-pane">
  <div class="studio-header">
    <div class="brand">
      <div class="brand-icon">💍</div>
      <div>
        <h1>WeddingCraft</h1>
        <span>Studio & Deployment Expert</span>
      </div>
    </div>
    <div class="preset-selector">
      <select id="presetSelect" onchange="loadPreset(this.value)">
        <option value="profiles/manish-sakshi.json">Manish & Sakshi (Traditional Rajasthani)</option>
        <option value="profiles/arjun-ananya.json">Arjun & Ananya (Contemporary Udaipur)</option>
      </select>
    </div>
  </div>

  <div class="studio-tabs">
    <button class="tab-btn active" onclick="switchTab('basic')">Couple & Date</button>
    <button class="tab-btn" onclick="switchTab('events')">Events & Dress</button>
    <button class="tab-btn" onclick="switchTab('venue')">Venue & Rides</button>
    <button class="tab-btn" onclick="switchTab('theme')">Theme & Music</button>
    <button class="tab-btn" onclick="switchTab('guests')">Guest Links</button>
    <button class="tab-btn" onclick="switchTab('deploy')">Export & Deploy</button>
  </div>

  <div class="tab-content" id="tabContent">
    <!-- Tab panels dynamically loaded -->
  </div>
</div>

<div class="preview-pane">
  <div class="preview-toolbar">
    <div class="device-toggle">
      <button class="device-btn active" onclick="setDevice('mobile')">📱 Mobile</button>
      <button class="device-btn" onclick="setDevice('tablet')">📲 Tablet</button>
      <button class="device-btn" onclick="setDevice('desktop')">💻 Desktop</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline" onclick="reloadPreview()">🔄 Refresh</button>
      <button class="btn btn-primary" onclick="openExternalPreview()">🔗 Open in New Tab</button>
    </div>
  </div>

  <div class="preview-stage">
    <div class="phone-frame" id="phoneFrame">
      <iframe id="previewFrame" src="index.html?noenvelope=1"></iframe>
    </div>
  </div>
</div>

<script>
var currentConfig = null;
var activeTab = 'basic';

function loadPreset(profilePath){
  fetch(profilePath)
    .then(function(r){ return r.json(); })
    .then(function(data){
      currentConfig = data;
      renderActiveTab();
      updatePreviewWithConfig(profilePath);
    })
    .catch(function(){
      alert('Could not load profile: ' + profilePath);
    });
}

function updatePreviewWithConfig(profilePath){
  var frame = document.getElementById('previewFrame');
  var url = 'index.html?profile=' + encodeURIComponent(profilePath) + '&noenvelope=1&t=' + Date.now();
  frame.src = url;
}

function reloadPreview(){
  var frame = document.getElementById('previewFrame');
  frame.src = frame.src;
}

function openExternalPreview(){
  var preset = document.getElementById('presetSelect').value;
  window.open('index.html?profile=' + encodeURIComponent(preset), '_blank');
}

function setDevice(type){
  var frame = document.getElementById('phoneFrame');
  document.querySelectorAll('.device-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  frame.className = 'phone-frame ' + (type === 'mobile' ? '' : type);
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  renderActiveTab();
}

function renderActiveTab(){
  var c = currentConfig;
  if(!c) return;
  var container = document.getElementById('tabContent');

  if(activeTab === 'basic'){
    container.innerHTML = `
      <div class="form-row">
        <div class="form-group">
          <label>Groom Prefix</label>
          <input type="text" value="${c.couple.groom.prefix || ''}" oninput="c.couple.groom.prefix=this.value">
        </div>
        <div class="form-group">
          <label>Groom Name</label>
          <input type="text" value="${c.couple.groom.name || ''}" oninput="c.couple.groom.name=this.value">
        </div>
      </div>
      <div class="form-group">
        <label>Groom Lineage / Bio</label>
        <textarea oninput="c.couple.groom.lineage=this.value">${c.couple.groom.lineage || ''}</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Bride Prefix</label>
          <input type="text" value="${c.couple.bride.prefix || ''}" oninput="c.couple.bride.prefix=this.value">
        </div>
        <div class="form-group">
          <label>Bride Name</label>
          <input type="text" value="${c.couple.bride.name || ''}" oninput="c.couple.bride.name=this.value">
        </div>
      </div>
      <div class="form-group">
        <label>Bride Lineage / Bio</label>
        <textarea oninput="c.couple.bride.lineage=this.value">${c.couple.bride.lineage || ''}</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Connector</label>
          <input type="text" value="${c.couple.connector || 'संग'}" oninput="c.couple.connector=this.value">
        </div>
        <div class="form-group">
          <label>Wax Seal Monogram</label>
          <input type="text" value="${c.couple.sealText || 'म❤सा'}" oninput="c.couple.sealText=this.value">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Wedding Date (ISO)</label>
          <input type="text" value="${c.date.iso || ''}" oninput="c.date.iso=this.value">
        </div>
        <div class="form-group">
          <label>Date Display</label>
          <input type="text" value="${c.date.display || ''}" oninput="c.date.display=this.value">
        </div>
      </div>
      <div class="form-group">
        <label>Auspicious Shloka / Invocation</label>
        <textarea oninput="c.invocation.shlok=this.value">${c.invocation ? c.invocation.shlok : ''}</textarea>
      </div>
    `;
  } else if(activeTab === 'events'){
    var evHtml = (c.events || []).map(function(ev, idx){
      return `
        <div class="event-item">
          <div class="event-item-header">
            <strong>${ev.name}</strong>
            <span style="font-size:0.7rem;color:var(--text-muted)">${ev.date} ${ev.month}</span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Ceremony Name</label>
              <input type="text" value="${ev.name}" oninput="c.events[${idx}].name=this.value">
            </div>
            <div class="form-group">
              <label>Time</label>
              <input type="text" value="${ev.time}" oninput="c.events[${idx}].time=this.value">
            </div>
          </div>
          <div class="form-group">
            <label>Location / Details</label>
            <input type="text" value="${ev.location || ev.detail || ''}" oninput="c.events[${idx}].detail=this.value">
          </div>
          <div class="form-group">
            <label>Dress Code Title</label>
            <input type="text" value="${ev.dressCode ? ev.dressCode.title : ''}" oninput="if(!c.events[${idx}].dressCode)c.events[${idx}].dressCode={};c.events[${idx}].dressCode.title=this.value">
          </div>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <label style="margin:0">Events & Ceremonies (${c.events ? c.events.length : 0})</label>
      </div>
      ${evHtml}
    `;
  } else if(activeTab === 'venue'){
    container.innerHTML = `
      <div class="form-group">
        <label>Venue Name</label>
        <input type="text" value="${c.venue ? c.venue.name : ''}" oninput="c.venue.name=this.value">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea oninput="c.venue.address=this.value">${c.venue ? c.venue.address : ''}</textarea>
      </div>
      <div class="form-group">
        <label>Google Maps URL</label>
        <input type="text" value="${c.venue ? c.venue.mapUrl : ''}" oninput="c.venue.mapUrl=this.value">
      </div>
      <div class="form-group">
        <label>Uber / Ola Direct Ride Link</label>
        <input type="text" value="${c.venue ? c.venue.uberUrl || '' : ''}" oninput="c.venue.uberUrl=this.value">
      </div>
      <div class="form-group">
        <label>Baraat / Guest Logistics Notice</label>
        <textarea oninput="c.venue.barat=this.value">${c.venue ? c.venue.barat || '' : ''}</textarea>
      </div>
    `;
  } else if(activeTab === 'theme'){
    container.innerHTML = `
      <div class="form-group">
        <label>Color Theme</label>
        <select onchange="applyThemePreview(this.value)">
          <option value="ivory" ${c.theme==='ivory'?'selected':''}>Ivory (Light Minimalist Elegance)</option>
          <option value="kesariya" ${c.theme==='kesariya'?'selected':''}>Kesariya (Warm Saffron Marigold)</option>
          <option value="pichwai" ${c.theme==='pichwai'?'selected':''}>Pichwai (Lotus Sage & Gold)</option>
          <option value="rajasthani" ${c.theme==='rajasthani'?'selected':''}>Rajasthani (Midnight Palace & Gold)</option>
          <option value="sindoori" ${c.theme==='sindoori'?'selected':''}>Sindoori (Royal Vermilion & Gold)</option>
          <option value="emerald" ${c.theme==='emerald'?'selected':''}>Emerald (Regal Emerald & Champagne Gold)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Audio Track URL or Asset</label>
        <input type="text" value="${c.music ? c.music.src : ''}" oninput="c.music.src=this.value">
      </div>
      <div class="form-group">
        <label>Host WhatsApp Phone (For 1-Click RSVPs)</label>
        <input type="text" value="${c.rsvp ? c.rsvp.whatsappPhone || '' : ''}" placeholder="e.g. 919414972688" oninput="c.rsvp.whatsappPhone=this.value">
      </div>
    `;
  } else if(activeTab === 'guests'){
    container.innerHTML = `
      <div class="form-group">
        <label>Guest Names (Paste one per line)</label>
        <textarea id="guestListInput" rows="5" placeholder="आदरणीय शर्मा जी&#10;राहुल & प्रिया&#10;वर्मा परिवार"></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-bottom:16px;" onclick="generateGuestLinks()">✨ Generate Personalized WhatsApp Links</button>
      <div id="generatedGuestLinks"></div>
    `;
  } else if(activeTab === 'deploy'){
    container.innerHTML = `
      <div class="form-group">
        <label>Export Current Configuration</label>
        <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="downloadConfig()">💾 Download config.json</button>
      </div>
      <div class="form-group" style="margin-top:20px;">
        <label>Zero-Cost Deployment Options</label>
        <div style="font-size:0.75rem;line-height:1.8;color:var(--text-muted);background:#11141c;padding:12px;border-radius:6px;border:1px solid var(--border);">
          <p><strong>1. GitHub Pages (Automated):</strong> Push changes to the <code>main</code> branch. The automated GitHub Action workflow will deploy your site in ~60 seconds.</p>
          <br>
          <p><strong>2. Cloudflare Pages:</strong> Connect your repository to Cloudflare Pages with build command empty and output directory <code>.</code> or <code>github-pages/</code>.</p>
          <br>
          <p><strong>3. Standalone Offline File:</strong> Run <code>python maker.py bundle-standalone</code> to generate a zero-dependency HTML file you can send directly over WhatsApp or Bluetooth.</p>
        </div>
      </div>
    `;
  }
}

function applyThemePreview(themeName){
  currentConfig.theme = themeName;
  var frame = document.getElementById('previewFrame');
  var preset = document.getElementById('presetSelect').value;
  frame.src = 'index.html?profile=' + encodeURIComponent(preset) + '&theme=' + themeName + '&noenvelope=1&t=' + Date.now();
}

function generateGuestLinks(){
  var raw = document.getElementById('guestListInput').value;
  var names = raw.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  if(!names.length){ alert('Please enter at least one guest name'); return; }

  var baseSiteUrl = window.location.origin + window.location.pathname.replace('studio.html', 'index.html');
  var preset = document.getElementById('presetSelect').value;

  var html = names.map(function(name){
    var inviteUrl = baseSiteUrl + '?profile=' + encodeURIComponent(preset) + '&to=' + encodeURIComponent(name) + '&fam=1';
    var waMsg = '🙏 सादर प्रणाम!\n\n' + name + ' जी, आपको सपरिवार हमारे शुभ विवाह समारोह में सादर आमंत्रित करते हैं।\n\n' +
      '💌 आपका व्यक्तिगत निमंत्रण पत्र यहाँ देखें:\n' + inviteUrl;
    var waShareUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(waMsg);

    return `
      <div class="guest-link-row">
        <span><strong>${name}</strong></span>
        <a href="${waShareUrl}" target="_blank">📲 Send WhatsApp</a>
      </div>
    `;
  }).join('');

  document.getElementById('generatedGuestLinks').innerHTML = html;
}

function downloadConfig(){
  var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentConfig, null, 2));
  var downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", "config.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

// Initial load
window.addEventListener('DOMContentLoaded', function(){
  loadPreset('profiles/manish-sakshi.json');
});
</script>
</body>
</html>
